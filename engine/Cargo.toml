[package]
name = "lotwise-engine"
version = "0.1.0"
edition = "2021"
description = "Lotwise tax-lot engine: US capital gains, wash sales across accounts, Section 1256. Estimates only, not tax advice."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
